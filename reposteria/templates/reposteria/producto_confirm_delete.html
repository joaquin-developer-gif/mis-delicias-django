<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar producto - Mis Delicias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Mis Delicias</a>
            <a class="btn btn-light btn-sm" href="{% url 'productos' %}">Volver a productos</a>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-header bg-white">
                <h1 class="h4 mb-0">Eliminar producto</h1>
            </div>

            <div class="card-body">
                <p>
                    ¿Estás seguro de que querés eliminar el producto 
                    <strong>"{{ producto.nombre }}"</strong>?
                </p>

                <form method="post">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        Sí, eliminar
                    </button>

                    <a href="{% url 'productos' %}" class="btn btn-secondary">
                        Cancelar
                    </a>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
