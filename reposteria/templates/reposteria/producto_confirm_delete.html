<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar producto - Mis Delicias</title>
</head>
<body>
    <h1>Eliminar producto</h1>

    <p>¿Estás seguro de que querés eliminar el producto "{{ producto.nombre }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <br>

    <a href="{% url 'productos' %}">Cancelar</a>
</body>
</html>
